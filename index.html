<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MemoryMan - PSX Save Vault</title>
<style>
:root{color-scheme:dark;--bg1:#22338a;--bg2:#04061a;--p1:#b4bada;--p2:#555b8a;--cell:#0a0f35;--edge:#3b479b;--ink:#eef1ff;--dim:#8d97d6;--hi:#7fd0ff;--bad:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,var(--bg1),var(--bg2) 72%) fixed #04061a;color:var(--ink);font:700 13px/1.35 "Trebuchet MS",Verdana,sans-serif;letter-spacing:.1em;text-transform:uppercase}
[hidden]{display:none!important}
main{max-width:920px;margin:0 auto;padding:18px 14px 28px}
h1{margin:6px 0 14px;text-align:center;font-size:22px;letter-spacing:.35em;text-shadow:0 0 14px var(--hi)}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-bottom:16px}
nav button{all:unset;cursor:pointer;padding:6px 4px;color:var(--ink);font:inherit}
nav button:hover,nav button:focus-visible{color:var(--hi)}
nav button:hover::before{content:"\25B8 ";color:var(--hi)}
nav button:disabled{opacity:.35;cursor:default}
nav button:disabled::before{content:""}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{padding:12px;border-radius:10px;background:linear-gradient(160deg,var(--p1),var(--p2));box-shadow:0 0 0 2px #fff3 inset,0 8px 24px #0009;color:#0b1033;opacity:.72}
.card.on{opacity:1;box-shadow:0 0 0 2px #fff inset,0 0 22px #7fd0ff66}
.card h2{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.card h2 small{font-size:10px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(var(--cell),#141b55);border:2px solid var(--edge);border-radius:3px}
.cell canvas{width:78%;image-rendering:pixelated}
.cell.link canvas{opacity:.5}
.cell.grp{border-color:var(--hi);background:#1d2b7a}
.cell.cur{border-color:#fff;box-shadow:0 0 10px #fff;animation:p 1s ease-in-out infinite alternate}
@keyframes p{to{box-shadow:0 0 2px #fff}}
.free{margin-top:8px;font-size:10px;text-align:right}
#info{margin-top:16px;padding:12px 14px;border:2px solid var(--edge);border-radius:8px;background:#0a0f3acc;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
#info span:nth-child(odd){color:var(--dim)}
#nm{font:inherit;letter-spacing:inherit;text-transform:none;color:var(--ink);background:#04061a;border:1px solid var(--edge);padding:4px 6px;width:100%;box-sizing:border-box}
#msg{min-height:18px;margin:12px 0 0;text-align:center;color:var(--hi)}
#msg.e{color:var(--bad)}
footer{margin-top:10px;text-align:center;font-size:10px;color:var(--dim)}
.tabs{display:flex;justify-content:center;gap:26px;margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:4px 2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--hi);border-color:var(--hi)}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;font-size:11px}
#bar input:not([type=checkbox]),#bar select{font:inherit;letter-spacing:inherit;text-transform:none;color:var(--ink);background:#04061a;border:1px solid var(--edge);padding:5px 7px}
#bar #who{flex:1;min-width:160px}
#vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
#vg>p{grid-column:1/-1;text-align:center;color:var(--dim)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;padding:10px;border-radius:8px;background:linear-gradient(160deg,var(--p1),var(--p2));color:#0b1033;display:flex;flex-direction:column;gap:4px;font-size:10px;opacity:.8}
.tile.sel{opacity:1;outline:3px solid #fff;box-shadow:0 0 16px var(--hi)}
.tile canvas{width:48px;padding:4px;background:var(--cell);border-radius:3px;image-rendering:pixelated}
.tt{font-size:12px;word-break:break-word}
.b{align-self:flex-start;padding:2px 6px;border-radius:3px;background:var(--cell);color:var(--hi)}
.b.o{color:var(--bad)}
#log{margin-top:14px;font-size:10px;color:var(--dim);line-height:1.8}
.cd{all:unset;box-sizing:border-box;cursor:pointer;position:relative;padding:12px 12px 18px;display:flex;flex-direction:column;gap:3px;font-size:10px;transition:transform .15s}
.cd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(#8a90b8,#3a3f66);border-top:1px solid #c9ceee}
.cd svg{width:100%;filter:drop-shadow(0 4px 4px #0008)}
.cd.sel{transform:translateY(-6px)}
.cd.sel svg{filter:drop-shadow(0 0 8px var(--hi))}
.cd.miss svg{filter:grayscale(1) opacity(.4)}
.cd.miss .tt{color:#ff7b7b}
.b.m{background:#b3202a;color:#fff;animation:p 1s ease-in-out infinite alternate}
#shg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:10px}
#shg>p{grid-column:1/-1;text-align:center;color:var(--dim)}
#pal{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
#pal input{font:inherit;letter-spacing:inherit;text-transform:none;color:var(--ink);background:#04061a;border:1px solid var(--edge);padding:5px 7px}
.sw{all:unset;box-sizing:border-box;width:22px;height:22px;border-radius:50%;border:2px solid #ffffff55;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 8px #fff}
@media(max-width:640px){#cards{grid-template-columns:1fr}}
</style></head><body><main>
<h1>MemoryMan</h1>
<div class="tabs"><button id="tv" class="on">Vault</button><button id="ts">Shelf</button><button id="te">Card Editor</button></div>
<div id="vt">
<nav><button id="scan">Scan Cards</button><button id="co">Check Out</button><button id="ci">Check In</button><button id="ex">Export Card</button><button id="vd">Remove</button><button id="bk">Backup</button><button id="rs">Restore</button><button id="inst" hidden>Install</button></nav>
<div id="bar"><input id="q" placeholder="Search"><select id="fl"><option value="">All<option value="in">In vault<option value="out">Checked out</select><input id="who" placeholder="Holder, e.g. Living Room PS1 / Alex"><label><input type="checkbox" id="ac"> Mark out on export</label><span id="cnt"></span></div>
<div id="vg"></div>
<div id="log"></div>
</div>
<div id="sh" hidden>
<nav><button id="ad">Add Cards</button><button id="rc">Recheck</button><button id="ao">Open in Editor</button><button id="rm">Remove Card</button></nav>
<div id="pal" hidden><span id="sws" style="display:flex;gap:6px;flex-wrap:wrap"></span><input id="lb" placeholder="Card label" maxlength="40"></div>
<div id="shg"></div>
</div>
<div id="ed" hidden>
<nav>
<button id="load">Load</button><button id="tov">To Vault</button><button id="save" disabled>Save</button><button id="copy">Copy &rarr; Other</button><button id="del">Delete</button><button id="ren">Rename</button><button id="fmt">Format</button>
</nav>
<div id="cards"></div>
<div id="info">
<span>Title</span><span id="t"></span>
<span>File</span><span id="f"></span>
<span>Region</span><span id="r"></span>
<span>Blocks</span><span id="n"></span>
<span>Rename</span><input id="nm" maxlength="32" placeholder="A-Z 0-9 space - . : ! &amp;" autocomplete="off">
</div></div>
<p id="msg"></p>
<footer>Load .mcr .mcd .srm .gme .vmp &middot; Save writes a raw .mcr &middot; Arrow keys move &middot; Titles are stored as full-width Shift-JIS</footer>
<input type="file" id="file" hidden><input type="file" id="sfile" multiple hidden><input type="file" id="rfile" accept=".json" hidden>
</main>
<script>
const $=s=>document.querySelector(s),BL=8192,SZ=131072;
const ck=(d,o)=>{let x=0;for(let i=0;i<127;i++)x^=d[o+i];d[o+127]=x};

function say(m,e){const p=$('#msg');p.textContent=m;p.className=e?'e':''}
function render(){
 ics=[];const M=$('#cards');M.textContent='';
 cards.forEach((c,ci)=>{
  const own=scan(c),p=document.createElement('section'),ref=own[sel.s];
  p.className='card'+(sel.c===ci?' on':'');
  const h=document.createElement('h2'),a=document.createElement('span'),b=document.createElement('small');
  a.textContent='Memory Card '+(ci+1);b.textContent=c.name;h.append(a,b);
  const G=document.createElement('div');G.className='grid';
  for(let s=0;s<15;s++){
   const x=document.createElement('button'),o=own[s];x.className='cell';
   if(o>=0){const cv=document.createElement('canvas');cv.width=cv.height=16;x.append(cv);ics.push({c,s:o,cv});if(o!==s)x.classList.add('link')}
   if(sel.c===ci){if(s===sel.s)x.classList.add('cur');else if(o>=0&&o===ref)x.classList.add('grp')}
   x.onclick=()=>{sel={c:ci,s};render()};G.append(x)}
  let n=0;for(let s=0;s<15;s++)if(st(c,s)>=0xA0)n++;
  const f=document.createElement('div');f.className='free';f.textContent='Free '+n+' / 15';
  p.append(h,G,f);M.append(p)});
 ics.forEach(i=>icon(i.c,i.s,i.cv,fr));info()}
function info(){
 const c=cards[sel.c],o=scan(c)[sel.s],E=o<0;
 $('#nm').disabled=E;$('#ren').disabled=E;$('#del').disabled=E;$('#copy').disabled=E;
 if(E){$('#t').textContent='Empty';$('#f').textContent='-';$('#r').textContent='-';$('#n').textContent='-';$('#nm').value='';return}
 const x=(o+1)*128,fn=String.fromCharCode(...c.d.subarray(x+10,x+31)).replace(/\0[\s\S]*/,''),sz=(c.d[x+4]|c.d[x+5]<<8|c.d[x+6]<<16)/BL,t=title(c,o).normalize('NFKC');
 $('#t').textContent=t;$('#f').textContent=fn;$('#r').textContent={I:'Japan',A:'America',E:'Europe'}[fn[1]]||'-';$('#n').textContent=sz;$('#nm').value=t}
const MAP={' ':0x8140,'-':0x817C,'.':0x8144,':':0x8146,'!':0x8149,'&':0x8195};
function sj(t){const r=[];for(const ch of t){const k=ch.charCodeAt(0);let w=MAP[ch];if(!w){if(k>=48&&k<=57)w=0x824F+k-48;else if(k>=65&&k<=90)w=0x8260+k-65;else if(k>=97&&k<=122)w=0x8281+k-97;else continue}r.push(w>>8,w&255)}return r.slice(0,64)}
function ask(k,btn,fn){if(arm===k){arm=null;btn.textContent=btn.dataset.l;fn();return}arm=k;btn.dataset.l=btn.textContent;btn.textContent='Sure?';setTimeout(()=>{if(arm===k){arm=null;btn.textContent=btn.dataset.l}},3000)}
function chain(c,o){const r=[];let k=o;while(k>=0&&r.length<15){r.push(k);k=nxt(c,k)}return r}
$('#ren').onclick=()=>{const c=cards[sel.c],o=scan(c)[sel.s];if(o<0)return;const b=sj($('#nm').value),p=(o+1)*BL+4;c.d.fill(0,p,p+64);c.d.set(b,p);render();say('Renamed')};
$('#del').onclick=function(){ask('d',this,()=>{const c=cards[sel.c],o=scan(c)[sel.s];if(o<0)return;chain(c,o).forEach(k=>{const x=(k+1)*128;c.d[x]+=0x50;ck(c.d,x)});render();say('Save deleted')})};
$('#fmt').onclick=function(){ask('f',this,()=>{fmt(cards[sel.c].d);render();say('Card '+(sel.c+1)+' formatted')})};
$('#copy').onclick=()=>{const a=cards[sel.c],b=cards[1-sel.c],o=scan(a)[sel.s];if(o<0)return;
 const ch=chain(a,o),fs=[];for(let s=0;s<15;s++)if(st(b,s)>=0xA0)fs.push(s);
 if(fs.length<ch.length)return say('Not enough free blocks on card '+(2-sel.c),1);
 ch.forEach((k,j)=>{const t=fs[j],x=(t+1)*128;b.d.set(a.d.subarray((k+1)*128,(k+2)*128),x);const n=j<ch.length-1?fs[j+1]:0xFFFF;b.d[x+8]=n&255;b.d[x+9]=n>>8;ck(b.d,x);b.d.set(a.d.subarray((k+1)*BL,(k+2)*BL),(t+1)*BL)});
 sel={c:1-sel.c,s:fs[0]};render();say('Copied '+ch.length+' block(s)')};
$('#load').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const u=new Uint8Array(await f.arrayBuffer()),off={[SZ]:0,[SZ+3904]:3904,[SZ+128]:128}[u.length];
 if(off===undefined)return say('Not a 128 KB memory card image',1);
 const d=u.slice(off,off+SZ);if(d[0]!==77||d[1]!==67)return say('No MC header found',1);
 cards[sel.c]={d,name:f.name};sel.s=0;render();say('Loaded into card '+(sel.c+1))};
$('#save').onclick=async()=>{const c=cards[sel.c],b=c.name.replace(/\.[^.]*$/,'')||'card';
 try{if(c.h){const w=await c.h.createWritable();await w.write(c.d);await w.close();say('Saved '+c.name)}else{await dl.save({filename:b+'.mcr',data:c.d});say('Saved '+b+'.mcr')}}catch(e){say('Save failed',1)}};
onkeydown=e=>{if(e.target.tagName==='INPUT')return;const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[e.key];if(m===undefined)return;e.preventDefault();const n=sel.s+m;if(n>=0&&n<15){sel.s=n;render()}};
/* ---- Vault ---- */
let DB={e:[],l:[],c:[]},pick=new Set(),vics=[],lastH='',sc=null,busy=0;
const idb=(m,f)=>new Promise((res,rej)=>{const r=indexedDB.open('memoryman',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const t=r.result.transaction('k',m),q=f(t.objectStore('k'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}});
const loaded=idb('readonly',o=>o.get('db')).then(j=>{if(j&&j.e){DB={e:j.e,l:j.l||[],c:j.c||[]};vrender()}}).catch(()=>{});
const snap=b=>({e:DB.e.map(({_c,v,...r})=>r),l:DB.l,c:DB.c.map(k=>b?(({h,...r})=>r)(k):k)}),persist=()=>loaded.then(()=>idb('readwrite',o=>o.put(snap(),'db'))).catch(()=>say('Vault cannot be stored in this browser - back up or export cards',1));
const lg=m=>{DB.l.unshift({t:Date.now(),m});DB.l.length=Math.min(DB.l.length,40)};
const el=(t,c,x)=>{const n=document.createElement(t);n.className=c||'';n.textContent=x||'';return n};
const b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const S=128+BL,sp=()=>DB.e.filter(e=>pick.has(e.id));
function parse(u){const off={[SZ]:0,[SZ+3904]:3904,[SZ+128]:128}[u.length];if(off===undefined)return null;const d=u.slice(off,off+SZ);return d[0]===77&&d[1]===67?d:null}
function addSave(c,o,src){const ch=chain(c,o),u=new Uint8Array(ch.length*S);
 ch.forEach((k,j)=>{u.set(c.d.subarray((k+1)*128,(k+2)*128),j*S);u.set(c.d.subarray((k+1)*BL,(k+2)*BL),j*S+128)});
 const x=(o+1)*128,fn=String.fromCharCode(...c.d.subarray(x+10,x+31)).replace(/\0[\s\S]*/,'');
 let h=2166136261;for(const ch2 of fn)h=Math.imul(h^ch2.charCodeAt(0),16777619);
 for(let i=0;i<u.length;i++)if(i%S>=128)h=Math.imul(h^u[i],16777619);

function vrender(){
 const tot={},cur={};DB.e.sort((a,b)=>a.added-b.added);DB.e.forEach(e=>tot[e.fn]=(tot[e.fn]||0)+1);DB.e.forEach(e=>{cur[e.fn]=(cur[e.fn]||0)+1;e.v=cur[e.fn]});
 const q=$('#q').value.toLowerCase(),f=$('#fl').value,G=$('#vg');G.textContent='';vics=[];
 const A=DB.e.filter(e=>(!q||(e.t+e.fn).toLowerCase().includes(q))&&(!f||(f==='out')===!!e.out));
 if(!A.length)G.append(el('p','',DB.e.length?'No matches':'Vault empty - scan memory cards to begin'));
 A.forEach(e=>{const t=el('button','tile'+(pick.has(e.id)?' sel':'')),cv=document.createElement('canvas');cv.width=cv.height=16;
  if(!e._c){const d=new Uint8Array(2*BL);d.set(unb64(e.d).subarray(128,S),BL);e._c={d}}
  vics.push({c:e._c,cv});icon(e._c,0,cv,fr);
  t.append(cv,el('div','tt',e.t),el('span','',e.fn+(tot[e.fn]>1?' / v'+e.v:'')),el('span','',e.n+' block'+(e.n>1?'s':'')),el('span','b'+(e.out?' o':''),e.out?'Out: '+e.out+' ('+new Date(e.at).toLocaleDateString()+')':'In vault'),el('span','','Seen: '+e.seen+(DB.c.some(k=>k.name===e.seen&&k.st==='missing')?' (card missing!)':'')));

 $('#cnt').textContent=P.length+' selected / '+bl+' of 15 blocks';$('#cnt').style.color=bl>15?'var(--bad)':'';
 ['co','ci','vd','ex'].forEach(k=>$('#'+k).disabled=!P.length);
 $('#log').textContent='';DB.l.slice(0,6).forEach(x=>$('#log').append(el('div','',new Date(x.t).toLocaleDateString()+' - '+x.m)))}
function tab(n){[['v','vt'],['s','sh'],['e','ed']].forEach(([k,i])=>$('#'+i).hidden=k!==n);[['tv','v'],['ts','s'],['te','e']].forEach(([i,k])=>$('#'+i).className=k===n?'on':'');n==='v'?vrender():n==='s'?shelf():render()}
$('#tv').onclick=()=>tab('v');$('#ts').onclick=()=>tab('s');$('#te').onclick=()=>tab('e');

/* ---- Shelf ---- */
const COL={gray:['Classic Gray','#9b9ca3',0],clear:['Clear','#e8f4ff',1],smoke:['Smoke','#3a3a40',1],tblue:['Blue Clear','#3d7bff',1],tred:['Red Clear','#ff4455',1],tgreen:['Green Clear','#3ddc84',1],tpurple:['Purple Clear','#9b59ff',1],blue:['Blue','#2457c5',0],red:['Red','#c42b2b',0],green:['Green','#22914a',0],yellow:['Yellow','#e8c52a',0],orange:['Orange','#e8731f',0],purple:['Purple','#6a3fb5',0],black:['Black','#232326',0],white:['White','#e9e9ee',0]};
const ST={ok:'On hand',missing:'MISSING',locked:'Needs access',unlinked:'Unlinked',bad:'Unreadable'},dt=t=>t?new Date(t).toLocaleString([],{dateStyle:'short',timeStyle:'short'}):'-',cur=()=>DB.c.find(x=>x.id===sc);
function cardSVG(k){const[,c,t]=COL[k.color]||COL.gray,u=k.used||[],P='M12 6H84L114 36V120Q114 126 108 126H12Q6 126 6 120V12Q6 6 12 6Z';let x='';
 for(let i=0;i<15;i++)x+=`<rect x="${38.5+i%5*9}" y="${54+(i/5|0)*9}" width="7" height="7" fill="${u[i]?'#2d3fa8':'#c9c9d6'}"/>`;
 let g='';for(let i=0;i<8;i++)g+=`<rect x="${29+i*8}" y="114" width="5" height="6" fill="#e0b84a"/>`;
 let r='';for(let i=0;i<4;i++)r+=`<path d="M16 ${13+i*5}H72" stroke="#000" stroke-opacity=".28" stroke-width="2"/>`;
 const pcb=t?`<g clip-path="url(#sc)"><rect x="6" y="6" width="108" height="120" fill="#17703a"/><rect x="20" y="90" width="30" height="16" fill="#101010"/><rect x="58" y="92" width="18" height="12" fill="#101010"/><rect x="84" y="88" width="14" height="6" fill="#c9a24a"/><rect x="84" y="98" width="14" height="6" fill="#c9a24a"/><path d="M14 40v44M106 40v44" stroke="#7fd68f" stroke-opacity=".5" stroke-width="2"/></g>`:'';
 return `<svg viewBox="0 0 120 132" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient><clipPath id="sc"><path d="${P}"/></clipPath></defs>${pcb}<path d="${P}" fill="${c}" fill-opacity="${t?.4:1}" stroke="#000" stroke-opacity=".55" stroke-width="2"/><path d="${P}" fill="url(#sg)"/>${r}<rect x="18" y="32" width="84" height="52" rx="3" fill="#ecebf2"/><text x="60" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9" letter-spacing="1" fill="#222">MEMORY CARD</text>${x}<rect x="26" y="112" width="68" height="10" rx="2" fill="#0d0d12"/>${g}</svg>`}
function addCard(u,name,h,f){const d=parse(u);if(!d)return null;const c={d,name},own=scan(c),hs=[];let a=0,b=0;
 for(let s=0;s<15;s++)if(own[s]===s){addSave(c,s,name)?a++:b++;hs.push(lastH)}
 let k=DB.c.find(x=>x.name===name);if(!k){k={id:Math.random().toString(36).slice(2),name,color:'gray',added:Date.now()};DB.c.push(k)}
 Object.assign(k,{saves:hs,used:own.map(o=>o>=0),mt:f?f.lastModified:0,sz:u.length,chk:Date.now(),st:h||k.h?'ok':'unlinked',miss:0});if(h)k.h=h;return[a,b]}
async function scanFiles(it){let a=0,b=0,bad=0;for(const{f,h}of it){const r=addCard(new Uint8Array(await f.arrayBuffer()),f.name,h,f);if(!r){bad++;continue}a+=r[0];b+=r[1]}
 lg('Scanned '+it.length+' file(s): '+a+' new, '+b+' known');persist();vrender();shelf();say(a+' new / '+b+' already in vault'+(bad?' / '+bad+' skipped':''),bad&&!a)}
$('#sfile').onchange=e=>{const it=[...e.target.files].map(f=>({f,h:null}));e.target.value='';scanFiles(it)};
$('#scan').onclick=async()=>{if(!window.showOpenFilePicker)return $('#sfile').click();try{const hs=await showOpenFilePicker({multiple:true});scanFiles(await Promise.all(hs.map(async h=>({f:await h.getFile(),h}))))}catch{}};
$('#ad').onclick=()=>$('#scan').click();
async function recheck(user){if(busy)return;busy=1;let miss=0,chg=0,nw=0,lock=0;
 for(const k of DB.c){if(!k.h)continue;
  try{let p=await k.h.queryPermission({mode:'read'});if(p!=='granted'&&user)p=await k.h.requestPermission({mode:'read'});
   if(p!=='granted'){if(k.st!=='missing')k.st='locked';lock++;continue}
   const f=await k.h.getFile();if(k.st==='missing')lg('Card '+(k.label||k.name)+' is back');
   if(f.size!==k.sz||f.lastModified!==k.mt||k.st==='missing'||k.st==='bad'){const r=addCard(new Uint8Array(await f.arrayBuffer()),k.name,k.h,f);if(r){chg++;nw+=r[0]}else{k.st='bad';continue}}
   k.st='ok';k.chk=Date.now()}
  catch(e){if(e&&e.name==='NotFoundError'){if(k.st!=='missing'){k.miss=Date.now();lg('Card '+(k.label||k.name)+' is missing')}k.st='missing';miss++}else{k.st='locked';lock++}}}
 busy=0;persist();shelf();vrender();
 return DB.c.length?miss+' missing / '+chg+' updated'+(nw?' ('+nw+' new saves)':'')+(lock?' / '+lock+' need access':''):'Nothing to check'}
function shelf(){const G=$('#shg'),k0=cur();G.textContent='';
 if(!DB.c.length)G.append(el('p','','Shelf empty - add card files to register them'));
 DB.c.forEach(k=>{const b=el('button','cd'+(k===k0?' sel':'')+(k.st==='missing'?' miss':'')),s=el('div'),m=(k.saves||[]).length,u=(k.used||[]).filter(Boolean).length;
  s.innerHTML=cardSVG(k);
  b.append(s,el('div','tt',k.label||k.name),el('span','',m+' save'+(m==1?'':'s')+' / '+u+' of 15 blocks'),el('span','b'+(k.st==='ok'?'':k.st==='missing'?' m':' o'),ST[k.st]||k.st),el('span','',k.st==='missing'?'Missing since '+dt(k.miss):'Checked '+dt(k.chk)));
  b.onclick=()=>{sc=k.id;shelf()};G.append(b)});
 const P=$('#sws');P.textContent='';$('#pal').hidden=!k0;
 if(k0){Object.entries(COL).forEach(([key,[n,c,t]])=>{const w=el('button','sw'+(k0.color===key?' on':''));w.title=n;w.style.background=t?'linear-gradient('+c+'99,'+c+'99),repeating-conic-gradient(#99a 0 25%,#556 0 50%) 0/8px 8px':c;w.onclick=()=>{k0.color=key;persist();shelf()};P.append(w)});$('#lb').value=k0.label||''}
 ['ao','rm'].forEach(i=>$('#'+i).disabled=!k0);$('#rc').disabled=!DB.c.length;
 const n=DB.c.filter(k=>k.st==='missing').length;$('#ts').textContent='Shelf'+(n?' \u26A0 '+n:'');$('#ts').style.color=n?'var(--bad)':''}
$('#rc').onclick=async()=>{say('Checking...');const r=await recheck(1);say(r||'Already checking')};
$('#lb').onchange=e=>{const k=cur();if(k){k.label=e.target.value.trim();persist();shelf()}};
$('#rm').onclick=function(){ask('r',this,()=>{DB.c=DB.c.filter(x=>x.id!==sc);sc=null;lg('Removed a card from the shelf');persist();shelf();say('Card removed from shelf (its saves stay in the vault)')})};
$('#ao').onclick=async()=>{const k=cur();if(!k||!k.h)return say('This card is not linked to a file',1);try{const f=await k.h.getFile(),d=parse(new Uint8Array(await f.arrayBuffer()));if(!d)return say('Unreadable card file',1);cards[sel.c]={d,name:k.name,h:f.size===SZ?k.h:null};sel.s=0;tab('e');say('Opened '+k.name)}catch{say('Could not open - run Recheck to grant access',1)}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)recheck(0)});
loaded.then(()=>recheck(0));
$('#tov').onclick=()=>{const c=cards[sel.c],o=scan(c)[sel.s];if(o<0)return say('Select a save first',1);const r=addSave(c,o,c.name);if(r)lg('Added a save from '+c.name);persist();say(r?'Added to vault':'Already in vault')};
$('#co').onclick=()=>{const w=$('#who').value.trim();if(!w)return say('Enter who or which system holds the save',1);const P=sp();P.forEach(e=>{e.out=w;e.at=Date.now()});lg('Checked out '+P.length+' to '+w);persist();vrender();say('Checked out to '+w)};
$('#ci').onclick=()=>{const P=sp();P.forEach(e=>e.out='');lg('Checked in '+P.length+' save(s)');persist();vrender();say('Checked in')};
$('#vd').onclick=function(){ask('v',this,()=>{const n=pick.size;DB.e=DB.e.filter(e=>!pick.has(e.id));pick.clear();lg('Removed '+n+' save(s)');persist();vrender();say('Removed from vault')})};
$('#ex').onclick=async()=>{const P=sp(),bl=P.reduce((a,e)=>a+e.n,0);if(bl>15)return say('Too many blocks: '+bl+' of 15',1);if(!dl)return say('Saving is unavailable here',1);
 const c=mk('PSX-VAULT.mcr');P.forEach(e=>place(c,e));
 try{await dl.save({filename:'PSX-VAULT.mcr',data:c.d});const w=$('#who').value.trim(),m=$('#ac').checked&&w;
  if(m)P.forEach(e=>{e.out=w;e.at=Date.now()});lg('Exported '+P.length+' save(s) as a new card'+(m?' and checked out to '+w:''));persist();vrender();say('Card exported')}
 catch(x){if(x&&x.code!=='declined')say('Export failed: '+(x.code||'error'),1)}};
setInterval(()=>{fr++;ics.concat(vics).forEach(i=>icon(i.c,i.s||0,i.cv,fr))},450);
render();vrender();shelf();
dl={save:async({filename:n,data:d})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};$('#save').disabled=false;
$('#bk').onclick=()=>dl.save({filename:'memoryman-backup.json',data:JSON.stringify(snap(1))}).then(()=>say('Backup saved'));
$('#rs').onclick=()=>$('#rfile').click();
$('#rfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());let n=0;
 for(const x of j.e||[])if(x&&x.h&&x.d&&!DB.e.some(y=>y.h===x.h)){DB.e.push({id:x.id||Math.random().toString(36).slice(2),fn:x.fn,t:x.t,n:x.n,h:x.h,d:x.d,src:x.src||'',seen:x.seen||'',added:x.added||Date.now(),out:x.out||'',at:x.at});n++}

$('#inst').onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$('#inst').hidden=true};
if('launchQueue' in window)launchQueue.setConsumer(async p=>{let k=0;for(const h of p.files){const f=await h.getFile(),d=parse(new Uint8Array(await f.arrayBuffer()));if(!d)continue;cards[k++%2]={d,name:f.name,h:f.size===SZ?h:null}}if(k){sel.s=0;tab('e');say('Opened '+k+' card file(s)')}});
